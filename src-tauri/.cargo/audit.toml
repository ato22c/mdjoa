# cargo-audit 설정 — 수용된(accepted) 보안 권고 목록.
#
# 여기 등록된 것은 모두 "취약점(vulnerability)"이 아니라 unmaintained/unsound
# 정보성 경고이며, 거의 전부 Tauri 2의 전이 의존성(특히 Linux/GTK3 백엔드)에서
# 옵니다. 본 앱의 주 타깃은 Windows·macOS로, 해당 GTK 크레이트는 그 빌드에서
# 런타임에 쓰이지 않습니다. 업스트림(Tauri/gtk-rs)이 갱신되면 자연히 사라집니다.
#
# 이 목록 덕분에 `cargo audit`은 "실제 취약점"이 새로 생겼을 때만 실패하므로
# CI 게이트로 쓸 수 있습니다. 재검토: 분기마다 또는 Tauri 메이저 업데이트 시.
# (마지막 검토: 2026-06-14 — 취약점 0건)

[advisories]
ignore = [
  # ── Tauri Linux/GTK3 백엔드 전이 의존 (unmaintained, gtk-rs gtk4 이전 중) ──
  "RUSTSEC-2024-0413", # atk
  "RUSTSEC-2024-0416", # atk-sys
  "RUSTSEC-2024-0412", # gdk
  "RUSTSEC-2024-0418", # gdk-sys
  "RUSTSEC-2024-0411", # gdkwayland-sys
  "RUSTSEC-2024-0417", # gdkx11
  "RUSTSEC-2024-0414", # gdkx11-sys
  "RUSTSEC-2024-0415", # gtk
  "RUSTSEC-2024-0420", # gtk-sys
  "RUSTSEC-2024-0419", # gtk3-macros
  "RUSTSEC-2024-0429", # glib (unsound: VariantStrIter) — Linux/GTK 전이
  # ── 빌드타임 매크로 (unmaintained, 런타임 무관) ──
  "RUSTSEC-2024-0370", # proc-macro-error
  # ── 유니코드 테이블 (unmaintained, 전이 의존) ──
  "RUSTSEC-2025-0081", # unic-char-property
  "RUSTSEC-2025-0075", # unic-char-range
  "RUSTSEC-2025-0080", # unic-common
  "RUSTSEC-2025-0100", # unic-ucd-ident
  "RUSTSEC-2025-0098", # unic-ucd-version
]
