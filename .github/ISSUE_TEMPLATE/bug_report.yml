name: 버그 제보 / Bug report
description: 문제가 생겼어요 / Something is not working
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 어떤 문제인가요? / What happened?
      description: 기대한 동작과 실제 동작을 알려주세요. / What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법 / Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
  - type: input
    id: version
    attributes:
      label: 앱 버전 / App version
      description: 햄버거 메뉴 → 정보(About)에서 확인할 수 있어요.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 운영체제 / OS
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 진단 로그 (선택) / Diagnostic log (optional)
      description: |
        설정 → "진단 로그 폴더 열기"에서 `mdjoa.log`를 열어 관련 부분을 붙여넣어 주세요.
        로그에는 파일 경로가 포함될 수 있으니, 공개하기 싫은 부분은 지우고 올려주세요.
        Open Settings → "Open log folder", then paste the relevant part of `mdjoa.log`.
        Logs may contain file paths; remove anything private before posting.
      render: text
